<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightweave · For Reb &amp; JP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded without blocking: offline or on a slow network the app still starts, in fallback fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#ece6f4; --dim:rgba(236,230,244,.58); --faint:rgba(236,230,244,.22); --hair:rgba(255,255,255,.08);
  --glass:rgba(12,10,22,.66); --glass2:rgba(255,255,255,.045); --accent:#f2d7a2; --accent2:#b9c8ff;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02020a;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body.idle{cursor:none}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0;background:radial-gradient(ellipse at 50% 120%,#120d24 0%,#03030a 60%)}
#fx{z-index:1}
#cam{display:none}
#cam.room{display:block;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:0;filter:brightness(var(--dim,.6)) saturate(.85) contrast(1.05)}
#cam.room.bw{filter:brightness(var(--dim,.6)) grayscale(1) contrast(1.12)}
#dock button.rec{color:#ff6b6b}
#dock button.rec svg circle{fill:#ff6b6b}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- start ---------- */
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity 1.4s ease,visibility 1.4s;background:radial-gradient(ellipse at center,rgba(2,2,10,0) 0%,rgba(2,2,10,.55) 100%)}
#start.gone{opacity:0;visibility:hidden;pointer-events:none}
#start h1{font-family:var(--serif);font-weight:300;font-size:clamp(64px,11vw,148px);letter-spacing:.32em;margin:0 0 0 .32em;line-height:1;background:linear-gradient(180deg,#fff 0%,#f2d7a2 55%,#c9a6ff 120%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(242,215,162,.25))}
.picker{display:flex;align-items:center;gap:18px}
.picker button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:color .3s,background .3s}
.picker button:hover{color:var(--ink);background:var(--glass2)}
.pc{min-width:320px;text-align:center;cursor:pointer}
.pc .c{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.pc .t{font-family:var(--serif);font-style:italic;font-size:30px;font-weight:300;margin-top:4px}
.pc .d{font-size:12px;color:var(--faint);margin-top:4px;letter-spacing:.04em}
.go{display:flex;gap:12px;align-items:center}
.primary{display:flex;align-items:center;gap:12px;padding:15px 34px;border-radius:999px;background:linear-gradient(180deg,rgba(242,215,162,.16),rgba(242,215,162,.06));border:1px solid rgba(242,215,162,.35);color:#fbf1dc;font-size:14px;letter-spacing:.24em;text-transform:uppercase;transition:all .4s;box-shadow:0 0 40px rgba(242,215,162,.08)}
.primary:hover{background:linear-gradient(180deg,rgba(242,215,162,.28),rgba(242,215,162,.1));box-shadow:0 0 60px rgba(242,215,162,.22)}
.round{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair);color:var(--dim);transition:all .3s}
.round:hover{color:var(--ink);border-color:var(--faint)}
.privacy{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);letter-spacing:.03em}
.privacy svg.i{width:13px;height:13px}

/* ---------- now playing ---------- */
#np{position:fixed;left:0;right:0;bottom:12vh;z-index:3;text-align:center;pointer-events:none;opacity:0;transition:opacity 2.2s ease}
#np.on{opacity:1}
#np .c{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
#np .t{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(28px,4vw,46px);margin-top:6px;text-shadow:0 0 30px rgba(0,0,0,.6)}
#np .d{font-size:12px;color:var(--faint);margin-top:6px;letter-spacing:.06em}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--hair);transition:opacity .7s,transform .7s}
#dock.hide,#progress.hide,#hud.hide{opacity:0;pointer-events:none}
#dock.hide{transform:translateX(-50%) translateY(14px)}
#dock button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:color .25s,background .25s}
#dock button:hover{color:var(--ink);background:var(--glass2)}
#dock button.on{color:var(--accent)}
#dock .sep{width:1px;height:18px;background:var(--hair);margin:0 6px}
#dock .mode{width:auto;padding:0 12px;border-radius:999px;gap:8px;display:flex;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.14) var(--p,50%));border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 10px rgba(242,215,162,.6)}
#vol{width:78px;margin:0 6px}
#progress{position:fixed;left:0;right:0;bottom:0;height:14px;z-index:6;cursor:pointer;transition:opacity .7s}
#progress .bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,rgba(242,215,162,.1),rgba(242,215,162,.7));box-shadow:0 0 12px rgba(242,215,162,.5);width:0;transition:height .2s}
#progress:hover .bar{height:4px}

/* ---------- conductor hud ---------- */
#hud{position:fixed;left:26px;bottom:26px;z-index:5;display:flex;flex-direction:column;gap:9px;transition:opacity .8s;pointer-events:none}
#hud .row{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:11px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
#hud svg.i{width:14px;height:14px}
#hud .m{width:84px;height:2px;background:rgba(255,255,255,.1);position:relative;border-radius:2px}
#hud .m i{position:absolute;top:-1px;height:4px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
#hud .m:after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:8px;background:rgba(255,255,255,.25)}

/* ---------- studio ---------- */
#studio{position:fixed;top:0;right:0;bottom:0;width:356px;z-index:8;background:var(--glass);backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);border-left:1px solid var(--hair);transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overflow-x:hidden;padding:18px 20px 120px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
#studio.open{transform:none}
body.studio-open #dock{left:calc((100% - 356px) / 2)}
body.studio-open #hud{display:none}
#studio header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#studio header h2{font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.24em;margin:0;text-transform:uppercase}
#studio header button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
#studio header button:hover{color:var(--ink);background:var(--glass2)}
.sec{border-top:1px solid var(--hair);padding:16px 0 6px}
.sec h3{margin:0 0 12px;font-size:10.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.sec h3 svg.i{width:14px;height:14px}
.sec.disabled .body{opacity:.32;pointer-events:none;filter:saturate(.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--hair);background:var(--glass2);font-size:12.5px;color:var(--dim);transition:all .25s}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip.on{color:#fff;border-color:rgba(242,215,162,.55);background:rgba(242,215,162,.1);box-shadow:0 0 18px rgba(242,215,162,.12)}
.chip .sw{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chip .gl{font-size:14px;width:18px;text-align:center;line-height:1}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.world{position:relative;height:46px;border-radius:10px;overflow:hidden;border:1px solid var(--hair);text-align:left;padding:6px 9px;display:flex;align-items:flex-end;font-family:var(--serif);font-size:16px;font-style:italic;transition:all .3s;min-width:0}
.world span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgh{display:flex;align-items:center;gap:7px;margin:16px 0 8px;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);width:max-content;cursor:default}
.wgh:first-child{margin-top:10px}
.wgh svg.i{width:12px;height:12px}
.world:hover{border-color:var(--faint)}
.world.on{border-color:rgba(242,215,162,.7);box-shadow:0 0 22px rgba(242,215,162,.18)}
.world span{position:relative;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.world .wb{position:absolute;inset:0}
.chip .wn{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on .wn{color:var(--accent)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segb{padding:12px 8px;border-radius:12px;border:1px solid var(--hair);background:var(--glass2);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:all .25s}
.segb svg.i{width:22px;height:22px}
.segb:hover{color:var(--ink)}
.segb.on{color:#fff;border-color:rgba(242,215,162,.55);background:rgba(242,215,162,.1)}
.segs.small .segb{padding:8px 4px;font-size:10.5px;letter-spacing:.07em;flex-direction:row;justify-content:center;min-width:0}
.segs.small .segb svg.i{width:15px;height:15px}
.row{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.lab{font-size:12.5px;color:var(--ink);flex:none;width:104px;cursor:help;display:flex;align-items:center;gap:7px}
.lab svg.i{width:14px;height:14px;color:var(--dim)}
.row input[type=range]{flex:1;min-width:0}
.val{width:34px;text-align:right;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tog{position:relative;width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.1);flex:none;margin-left:auto;transition:background .25s}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#bbb;transition:all .25s}
.tog.on{background:rgba(242,215,162,.45)}
.tog.on:after{left:17px;background:#fff;box-shadow:0 0 10px rgba(242,215,162,.8)}
.trow{display:flex;align-items:center;gap:10px;padding:5px 0;margin-bottom:4px}
.trow .lab{width:auto}
.list{max-height:260px;overflow-y:auto;margin:0 -8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.piece{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;color:var(--dim);transition:background .2s,color .2s}
.piece:hover{background:var(--glass2);color:var(--ink)}
.piece.on{color:#fff;background:rgba(242,215,162,.09)}
.piece .pc1{font-size:10px;letter-spacing:.16em;text-transform:uppercase;width:84px;flex:none;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piece .pt{font-family:var(--serif);font-size:16.5px;font-style:italic;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piece .pt small{font-family:var(--sans);font-style:normal;font-size:10.5px;color:var(--faint);margin-left:6px}
.piece .st{color:var(--accent);font-size:10px;width:16px;flex:none;white-space:nowrap}
.piece .st .rb{color:var(--accent2);font-style:normal}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--hair);font-size:12px;color:var(--dim);transition:all .25s}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn svg.i{width:14px;height:14px}
.vers{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.ver{display:flex;align-items:center;gap:6px}
.ver button.vl{flex:1;text-align:left;padding:6px 10px;border-radius:8px;font-family:var(--serif);font-size:16px;font-style:italic;color:var(--dim)}
.ver button.vl:hover{background:var(--glass2);color:var(--ink)}
.ver button.vx{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.ver button.vx:hover{color:var(--ink)}
.ver button.vx svg.i{width:12px;height:12px}
#meters{width:100%;height:96px;display:block}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:20;max-width:270px;padding:12px 14px;border-radius:12px;background:rgba(18,15,30,.96);border:1px solid rgba(242,215,162,.22);box-shadow:0 18px 50px rgba(0,0,0,.5);font-size:12.5px;line-height:1.5;color:var(--ink);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;font-style:italic;margin-bottom:4px;color:#fff}
#tip i{display:block;margin-top:7px;color:var(--accent);font-style:normal;font-size:12px}
#tip i:before{content:"≈ ";opacity:.7}

#toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:20;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);backdrop-filter:blur(14px);font-size:12.5px;color:var(--ink);opacity:0;transition:all .4s;pointer-events:none;display:flex;gap:8px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#loading{position:fixed;top:24px;right:24px;z-index:7;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent);opacity:0;transition:opacity .4s;animation:pulse 1.4s ease-in-out infinite}
#loading.on{opacity:1}
@keyframes pulse{50%{transform:scale(.4);opacity:.3}}
#drop{position:fixed;inset:16px;border:1px dashed rgba(242,215,162,.5);border-radius:24px;z-index:30;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(2,2,10,.4)}
#drop.on{opacity:1}
#drop svg.i{width:46px;height:46px;color:var(--accent);stroke-width:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- keepsakes: the finished-sculpture card and the gallery ---------- */
#bFinish{display:none!important}
body.sculpting #bFinish{display:grid!important}
#keep{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:opacity .9s ease,transform .9s ease}
#keep.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
#keep .kc{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
#keep .kt{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(26px,3.4vw,40px);text-shadow:0 0 30px rgba(0,0,0,.7)}
#keep .kd{font-size:12px;color:var(--faint);letter-spacing:.06em}
#keep .kb{display:flex;align-items:center;gap:4px;margin-top:12px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--hair)}
#keep .kb button{height:38px;min-width:38px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase;transition:color .25s,background .25s}
#keep .kb button:hover{color:var(--ink);background:var(--glass2)}
#keep .kb button.primary{color:#1b1407;background:var(--accent);padding:0 18px 0 14px;box-shadow:0 0 22px rgba(242,215,162,.35)}
#keep .kb button.primary:hover{color:#1b1407;background:#f7e2b6}
#keep .ok,#keep .kk{display:none}
#keep.kept .kb button.primary{background:transparent;color:var(--accent);box-shadow:none;pointer-events:none}
#keep.kept .kb button.primary svg:first-child,#keep.kept .kl{display:none}
#keep.kept .ok,#keep.kept .kk{display:inline}
#keep.viewing .mk,#keep:not(.viewing) .vw{display:none}
#gal{position:fixed;inset:0;z-index:9;background:rgba(5,4,12,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:30px 38px 60px;overflow-y:auto;transition:opacity .4s}
#gal.hide{opacity:0;pointer-events:none}
#gal header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
#gal h2{font-family:var(--serif);font-weight:300;font-size:30px;letter-spacing:.26em;text-transform:uppercase;margin:0}
#gal header button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
#gal header button:hover{color:var(--ink);background:var(--glass2)}
#gGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.kcard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--hair);background:var(--glass2);transition:border-color .3s,transform .3s,box-shadow .3s}
.kcard:hover{border-color:rgba(242,215,162,.45);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.kcard .kopen{display:block;width:100%;text-align:left;color:var(--ink)}
.kcard img,.kcard .kopen i{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.kcard .t{display:block;padding:11px 14px 0;font-family:var(--serif);font-style:italic;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .d{display:block;padding:3px 14px 13px;font-size:11px;color:var(--faint);letter-spacing:.06em}
.kcard .del{position:absolute;top:8px;right:8px;height:30px;min-width:30px;padding:0 9px;border-radius:999px;display:grid;place-items:center;background:rgba(0,0,0,.55);color:var(--dim);opacity:0;transition:opacity .2s;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.kcard:hover .del,.kcard .del.sure{opacity:1}
.kcard .del.sure{color:#ffb4a8}
.kcard .del svg.i{width:14px;height:14px}
.gempty{display:grid;place-items:center;height:56vh;color:var(--faint);grid-column:1/-1}
.gempty svg.i{width:64px;height:64px;stroke-width:1}
/* ---------- Lightweave ---------- */
#bMode,#bGhost,#bShim,#bRoom,#bStudio,#beginMouse,#hud,#studio{display:none!important}
#start{gap:30px;background:radial-gradient(ellipse 46% 42% at center,rgba(2,2,10,.62) 0%,rgba(2,2,10,.32) 60%,rgba(2,2,10,0) 100%),radial-gradient(ellipse at center,rgba(2,2,10,0) 0%,rgba(2,2,10,.55) 100%)}
#start h1{font-size:clamp(46px,7.4vw,104px);letter-spacing:.2em;margin:0 0 0 .2em;line-height:1.1;padding-bottom:.26em;margin-bottom:-.26em}
#start .for{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(20px,2.3vw,29px);color:var(--dim);letter-spacing:.05em;margin-top:-10px}
#start .picker,#start .choices{display:none}
/* the introduction: a few words, once, over the light */
#intro{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .8s}
#intro.hide{opacity:0}
#intro .il{max-width:min(920px,86vw);text-align:center;text-wrap:balance;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(28px,3.6vw,50px);line-height:1.25;color:#fbf1dc;text-shadow:0 0 30px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.6);opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease}
#intro .il.on{opacity:1;transform:none}
#intro button{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);pointer-events:auto;padding:9px 22px;border-radius:999px;border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--dim);font-size:11px;letter-spacing:.24em;text-transform:uppercase;transition:color .25s}
#intro button:hover{color:var(--ink)}
#intro.hide button{pointer-events:none}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:920px;padding:0 16px}
.seg2{display:inline-flex;padding:4px;gap:2px;border-radius:999px;border:1px solid var(--hair);background:var(--glass2)}
.seg2 button{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);transition:color .25s,background .25s,box-shadow .25s}
.seg2 button:hover{color:var(--ink)}
.seg2 button.on{color:#fbf1dc;background:rgba(242,215,162,.16);box-shadow:inset 0 0 0 1px rgba(242,215,162,.42)}
.seg2 button svg.i{width:16px;height:16px}
.dchoices{display:flex;gap:6px}
#dock .seg2{padding:2px}
#dock .seg2 button{width:auto;height:30px;padding:0 11px;gap:6px;font-size:10px;letter-spacing:.14em;border-radius:999px;display:flex}
#dock .seg2 button svg.i{width:14px;height:14px}
#dock .seg2 button.on{color:var(--accent)}
@media (max-width:1280px){#dock .seg2 button span{display:none}#dock .seg2 button{padding:0 9px}}
#dock #bSong{width:auto;max-width:270px;padding:0 13px 0 10px;border-radius:999px;display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink)}
#bSong span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bSong svg.i{flex:none;width:16px;height:16px;color:var(--dim)}
#bSong svg.menu{margin-left:2px;padding-left:9px;border-left:1px solid var(--hair);width:25px;box-sizing:content-box;color:var(--ink)}
#bSong:hover svg.menu{color:var(--accent)}
#songs{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:7;width:400px;max-width:calc(100vw - 32px);padding:8px;border-radius:18px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--hair);box-shadow:0 18px 60px rgba(0,0,0,.45);transition:opacity .25s,transform .25s}
#songs.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(8px)}
#songs .list{max-height:52vh;margin:0}
</style>
</head>
<body>

<canvas id="fx" class="layer"></canvas>

<div id="start">

  <div class="picker">
    <button id="pPrev" aria-label="Previous piece" data-tip="Previous piece"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

    <button class="round" id="beginMouse" aria-label="Begin with mouse" data-tip-title="Begin with mouse" data-tip="No camera: your cursor becomes one hand. Hold the button to pinch, scroll to open or close the hand, hold Shift to throw it wide open, hold Alt to make a fist."><svg class="i" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v3"/></svg></button>
  </div>

</div>

<div id="keep" class="hide">
  <div class="kc"></div><div class="kt"></div><div class="kd"></div>
  <div class="kb">

    <button id="kAgain" class="mk" aria-label="Again" data-tip-title="Again" data-tip="Clear the wheel and play the same piece from the start."><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8H8"/><path d="M8 1L5 4l3 3"/></svg></button>
    <button id="kNext" class="mk" aria-label="Next piece" data-tip-title="Next piece" data-tip="Clear the wheel and start the next piece."><svg class="i" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button>

  </div>
</div>

  <div class="row" data-k="dyn"><svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 010 8"/></svg><div class="m"><i></i></div><span></span></div>
  <div class="row" data-k="hall"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h18M5 20V10l7-6 7 6v10"/><path d="M10 20v-5a2 2 0 014 0v5"/></svg><div class="m"><i></i></div><span></span></div>
</div>

  <button id="bPlay" aria-label="Play or pause" data-tip="Play / pause" data-key="Space"><svg class="i" viewBox="0 0 24 24" id="playIco"><path d="M8 5v14M16 5v14"/></svg></button>
  <button id="bNext" aria-label="Next piece" data-tip="Next piece"><svg class="i" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button>
  <button id="bSong" aria-label="Choose the music" data-tip-title="Music" data-tip="Open the list of songs. Your song comes first, then Reb's favorites, marked with a heart. You can also drop any audio file onto the window." data-tip-ana="Like picking the record before the first dance."><svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span id="songLab"></span><svg class="i menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

  <button id="bShim" aria-label="Shimmer layer" data-tip-title="Shimmer" data-tip="Quick flicks of your hand ring soft bell tones, timed to the music's pulse and tuned to its key. Always a whisper beneath the recording. Key: B"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/><path d="M19 4l1-1M21 8h1M5 4L4 3M3 8H2"/></svg></button>
  <button id="bRoom" aria-label="Sky or your room" data-tip-title="Sky / Your room" data-tip="Switch between the light living in its own sky and the light overlaid on your camera, so you see yourself in your own room. Key: R"><svg class="i" viewBox="0 0 24 24"><path d="M3 8a2 2 0 012-2h2l2-2h6l2 2h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button id="bSnap" aria-label="Snapshot" data-tip-title="Snapshot" data-tip="Save a picture of exactly what is on screen."><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg></button>
  <button id="bRec" aria-label="Record" data-tip-title="Record" data-tip="Record a video of the screen with the music. Press again to stop and save it."><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" fill="none"/></svg></button>

  <button id="bKeep" aria-label="Keepsakes" data-tip-title="Keepsakes" data-tip="Every sculpture you have kept, one for each piece. Key: K"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
  <button id="bIntro" aria-label="How it works" data-tip-title="How it works" data-tip="Play the short introduction again." data-tip-ana="Like asking the usher to show you to your seats."><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 014.9.6c0 1.7-2.5 2.1-2.5 3.8"/><path d="M12 17.2h.01"/></svg></button>
  <button id="bHide"></button>
  <button id="bFs" aria-label="Fullscreen" data-tip="Fullscreen" data-key="F"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bStudio" aria-label="Studio" data-tip-title="Studio" data-tip="Mix and tune every part of the experience, and save versions to compare. Key: S"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>

<script>
/* ===== Nature worlds: Grove, Riverbed, Murmuration, Shoal ===== */
// Lumen nature worlds: Grove (a dancing tree), Riverbed (luminous stones that collide and crack),
// Murmuration (a 3D boids flock of starlings) and Shoal (schools of fish milling in deep water).
// Classic script: registers itself through window.LumenPlugins; index.html calls it with a small API.
(function () {
'use strict';
(window.LumenPlugins = window.LumenPlugins || []).push(function (api) {
  const { S, FX, MEDIA, WORLDS, MEDIA_IMPL, ctx, sprite, col, ci, mcol, SN, curl, rnd, clamp, lerp, smoothstep, expK, hyp, TAU, trailSmooth, trailEdges, trailFill, trailCenter, TRL } = api;
  const PP = () => api.P;                       // P is reassigned inside index.html, so always read it fresh
  const SPR = i => api.spr(i), CORE = () => api.core();
  const quota = () => clamp(PP().budget, .2, 2) * S.q;
  const hw = h => h.present * (h.kind === 'spirit' ? .45 : 1);
  const bandAt = u => S.au.bands[clamp(Math.round(u * 4), 0, 4)] || 0;   // u: 0 bass .. 1 treble
  // stretched glow (sprite with independent width/height)
  function glowE(img, x, y, w, h, a) { if (a <= .003) return; ctx.globalAlpha = a > 1 ? 1 : a; ctx.drawImage(img, x - w / 2, y - h / 2, w, h); }
  // smooth closed curve through the midpoints of a flat point list
  function closedCurve(X, Y, n) {
    ctx.moveTo((X[n - 1] + X[0]) * .5, (Y[n - 1] + Y[0]) * .5);
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; ctx.quadraticCurveTo(X[i], Y[i], (X[i] + X[j]) * .5, (Y[i] + Y[j]) * .5); }
    ctx.closePath();
  }
  function mkRand(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const avgHand = () => { let x = 0, y = 0, w = 0; for (const h of S.hands) { const k = hw(h); x += h.x * k; y += h.y * k; w += k; } return w > .01 ? [x / w, y / w, Math.min(1, w)] : [S.W / 2, S.H / 2, 0]; };

  // ============================================================== shared 3D camera for the flocks
  // world: x right, y down, z into the screen. The camera leans gently toward the hands, so near things
  // slide more than far things (true parallax).
  const CAM = { x: 0, y: 0, f: 1, cx: 0, cy: 0 };
  function camUpdate(dt, k = .18) {
    const [hx, hy, w] = avgHand();
    const tx = ((hx / S.W) - .5) * k * w, ty = ((hy / S.H) - .5) * k * .5 * w;
    CAM.x += (tx - CAM.x) * expK(dt, 1.2); CAM.y += (ty - CAM.y) * expK(dt, 1.2);
    CAM.f = S.H * .95; CAM.cx = S.W / 2; CAM.cy = S.H * .47;
  }
  // screen → world point at depth z
  const unX = (sx, z) => (sx - CAM.cx) * z / CAM.f + CAM.x, unY = (sy, z) => (sy - CAM.cy) * z / CAM.f + CAM.y;

  // ============================================================== boids engine (typed arrays + spatial hash)
  const HS = 8192;
  function Flock(cap) {
    this.cap = cap; this.n = 0;
    for (const k of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'ax', 'ay', 'az', 'fl', 'ph', 'sz', 'wv', 'sx', 'sy', 'ss']) this[k] = new Float32Array(cap);
    this.g = new Uint8Array(cap); this.next = new Int32Array(cap); this.head = new Int32Array(HS); this.par = 0;
  }
  // flocking steering for half the birds each frame (the other half keeps last frame's steering)
  Flock.prototype.steer = function (o) {
    const n = this.n, X = this.x, Y = this.y, Z = this.z, VX = this.vx, VY = this.vy, VZ = this.vz, G = this.g, nx = this.next, hd = this.head;
    const c = o.nbR, ic = 1 / c, nb2 = o.nbR * o.nbR, sp2 = o.sepR * o.sepR, maxN = o.maxN, sameG = o.sameGroup;
    hd.fill(-1);
    const key = (ix, iy, iz) => (Math.imul(ix, 92837111) ^ Math.imul(iy, 689287499) ^ Math.imul(iz, 283923481)) & (HS - 1);
    for (let i = 0; i < n; i++) { const k = key(Math.floor(X[i] * ic), Math.floor(Y[i] * ic), Math.floor(Z[i] * ic)); nx[i] = hd[k]; hd[k] = i; }
    this.par ^= 1;
    for (let i = this.par; i < n; i += 2) {
      const px = X[i], py = Y[i], pz = Z[i], ix = Math.floor(px * ic), iy = Math.floor(py * ic), iz = Math.floor(pz * ic), gi = G[i];
      let cnt = 0, sx = 0, sy = 0, sz = 0, axx = 0, ayy = 0, azz = 0, cxx = 0, cyy = 0, czz = 0;
      outer: for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let d = -1; d <= 1; d++) {
        let j = hd[key(ix + a, iy + b, iz + d)];
        while (j >= 0) {
          if (j !== i && (!sameG || G[j] === gi)) {
            const dx = px - X[j], dy = py - Y[j], dz = pz - Z[j], d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < nb2) {
              cnt++; axx += VX[j]; ayy += VY[j]; azz += VZ[j]; cxx += X[j]; cyy += Y[j]; czz += Z[j];
              if (d2 < sp2) { const dd = Math.sqrt(d2) + 1e-4, f = (1 - dd / o.sepR) / dd; sx += dx * f; sy += dy * f; sz += dz * f; }
              if (cnt >= maxN) break outer;
            }
          }
          j = nx[j];
        }
      }
      let ax = 0, ay = 0, az = 0;
      if (cnt) {
        const ic2 = 1 / cnt, ks = o.wSep * 3 / Math.sqrt(cnt), kc = o.wCoh / o.nbR;
        ax += sx * ks; ay += sy * ks; az += sz * ks;
        ax += (axx * ic2 - VX[i]) * o.wAli + (cxx * ic2 - px) * kc;
        ay += (ayy * ic2 - VY[i]) * o.wAli + (cyy * ic2 - py) * kc;
        az += (azz * ic2 - VZ[i]) * o.wAli + (czz * ic2 - pz) * kc;
      }
      this.ax[i] = ax; this.ay[i] = ay; this.az[i] = az;
    }
  };
  // keep the projected position inside the frame (soft walls in screen space) and z within [z0, z1]
  Flock.prototype.contain = function (i, z0, z1, mx, my0, my1, k) {
    const z = this.z[i], f = CAM.f / z;
    const u = (this.x[i] - CAM.x) * f / (S.W * .5), v = (this.y[i] - CAM.y) * f / (S.H * .5) + (CAM.cy - S.H * .5) / (S.H * .5);
    let ax = 0, ay = 0, az = 0;
    if (u > mx) ax -= (u - mx) * k; else if (u < -mx) ax -= (u + mx) * k;
    if (v > my1) ay -= (v - my1) * k; else if (v < -my0) ay -= (v + my0) * k;
    if (z < z0) az += (z0 - z) * k; else if (z > z1) az -= (z - z1) * k;
    return [ax * z * .6, ay * z * .6, az];
  };
  Flock.prototype.project = function () {
    const n = this.n, f = CAM.f;
    for (let i = 0; i < n; i++) { const s = f / this.z[i]; this.ss[i] = s; this.sx[i] = CAM.cx + (this.x[i] - CAM.x) * s; this.sy[i] = CAM.cy + (this.y[i] - CAM.y) * s; }
  };

  // ============================================================== 1. GROVE: the dancing tree
  const TREE = {
    trees: [], fall: [], motes: [], grow: .84, bloom: .55, gust: [0, 0], swayV: 0,
    CX: new Float32Array(160), CY: new Float32Array(160), CW: new Float32Array(160),
    gen(seed, maxD, opt) {

function worldTip(n) {
  const w = WORLDS[n], d = WORLD_TIPS[n];
  return d ? [n, d[0], d[1]] : [n, `${w.media.map(m => MEDIA[m]?.name || m).join(' + ')}, ${SKIES[w.sky]?.name || ''} sky, ${PALETTES[w.palette]?.name || ''} colors.`, ''];
}
function worldGroups() {
  const listed = new Set(WORLD_GROUPS.flatMap(g => g[2])), more = Object.keys(WORLDS).filter(n => !listed.has(n));
  const gs = WORLD_GROUPS.map(g => ({ name: g[0], icon: g[1], worlds: g[2].filter(n => WORLDS[n]), tip: g[3] }));
  if (more.length) gs.push({ name: 'More', icon: 'layers', worlds: more, tip: ['More', 'Other worlds.', ''] });
  return gs.filter(g => g.worlds.length);
}
const groupOfWorld = n => Math.max(0, worldGroups().findIndex(g => g.worlds.includes(n)));
const worldOrder = () => worldGroups().flatMap(g => g.worlds);

const A = { ctx: null, el: null, ready: false, playing: false };
const WORKLET = `
class Freeze extends AudioWorkletProcessor{
 static get parameterDescriptors(){return[{name:'freeze',defaultValue:0,minValue:0,maxValue:1},{name:'pos',defaultValue:0,minValue:0,maxValue:1}]}
 constructor(){super();this.N=Math.floor(sampleRate*5);this.b=[new Float32Array(this.N),new Float32Array(this.N)];this.w=0;this.mix=0;this.g=[];this.next=0;this.anchor=0;this.was=false;}
 process(ins,outs,p){
  const inp=ins[0],out=outs[0],n=out[0].length,N=this.N,sr=sampleRate;
  const fz=p.freeze[0]>0.5,pos=p.pos[0];
  if(fz&&!this.was)this.anchor=this.w; this.was=fz;
  const L=inp&&inp[0]?inp[0]:null,R=inp&&inp[1]?inp[1]:L;
  const oL=out[0],oR=out[1]||out[0]; const step=1/(0.14*sr);
  for(let i=0;i<n;i++){
   const dl=L?L[i]:0,dr=R?R[i]:0;
   if(!fz){this.b[0][this.w]=dl;this.b[1][this.w]=dr;this.w=(this.w+1)%N;}
   this.mix+=fz?Math.min(step,1-this.mix):-Math.min(step,this.mix);
   let wl=0,wr=0;
   if(this.mix>0){
    if(--this.next<=0){
     const len=Math.floor(sr*(0.09+Math.random()*0.17));
     const back=Math.floor(sr*(0.3+pos*3.6+Math.random()*0.2));
     let st=this.anchor-back-len; st=((st%N)+N)%N;
     const r=Math.random(); const rate=r<0.1?2:(r<0.18?0.5:1);
     this.g.push({p:st,i:0,len:rate===2?len>>1:len,rate,pan:Math.random()*0.9-0.45});
     if(this.g.length>16)this.g.shift();
     this.next=Math.floor(sr*(0.016+Math.random()*0.022));
    }
    for(let k=this.g.length-1;k>=0;k--){const g=this.g[k];const e=Math.sin(Math.PI*g.i/g.len);const e2=e*e*0.3;
     const idx=(g.p+Math.floor(g.i*g.rate))%N; wl+=this.b[0][idx]*e2*(1-g.pan); wr+=this.b[1][idx]*e2*(1+g.pan);
     if(++g.i>=g.len)this.g.splice(k,1);}
   } else if(this.g.length) this.g.length=0;
   oL[i]=dl*(1-this.mix)+wl*this.mix; if(oR!==oL)oR[i]=dr*(1-this.mix)+wr*this.mix;
  }
  return true;
 }
}
registerProcessor('lumen-freeze',Freeze);`;

function makeIR(ctx, secs = 3.4, decay = 2.6) {
  const sr = ctx.sampleRate, len = Math.floor(sr * secs), buf = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c); let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len; const n = Math.random() * 2 - 1; lp += (n - lp) * (0.25 + 0.6 * (1 - t));
      d[i] = lp * Math.pow(1 - t, decay) * (i < sr * .012 ? i / (sr * .012) : 1);
    }
  }
  return buf;
}

async function initAudio() {
  if (A.ctx) return;
  const ctx = A.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const el = A.el = new Audio(); el.crossOrigin = 'anonymous'; el.preload = 'auto'; el.preservesPitch = true; el.mozPreservesPitch = true;
  const src = ctx.createMediaElementSource(el);
  const g = (v = 1) => { const n = ctx.createGain(); n.gain.value = v; return n; };
  A.vol = g(P.vol); A.vol.connect(ctx.destination);
  A.mix = g(1); A.mix.connect(A.vol);
  A.an = ctx.createAnalyser(); A.an.fftSize = 2048; A.an.smoothingTimeConstant = 0; A.mix.connect(A.an);
  // pure path: untouched
  A.pure = g(P.mode === 'listen' ? 1 : 0); src.connect(A.pure); A.pure.connect(A.mix);
  // conductor path
  A.condOut = g(P.mode === 'conduct' ? 1 : 0);
  A.dyn = g(1); A.cut = g(1);
  A.lp = ctx.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 20000; A.lp.Q.value = .5;
  A.shelf = ctx.createBiquadFilter(); A.shelf.type = 'highshelf'; A.shelf.frequency.value = 2800; A.shelf.gain.value = 0;
  A.shaper = ctx.createWaveShaper(); { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; c[i] = Math.tanh(2.6 * x) / Math.tanh(2.6); } A.shaper.curve = c; A.shaper.oversample = '2x'; }
  A.dry = g(1); A.wet = g(0);
  A.pan = ctx.createStereoPanner();
  A.rev = ctx.createConvolver(); A.rev.buffer = makeIR(ctx); A.revSend = g(0); A.revOut = g(.9);
  A.lim = ctx.createDynamicsCompressor(); A.lim.threshold.value = -4; A.lim.knee.value = 6; A.lim.ratio.value = 16; A.lim.attack.value = .003; A.lim.release.value = .25;
  let head = src;
  try {
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    A.freeze = new AudioWorkletNode(ctx, 'lumen-freeze', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
    src.connect(A.freeze); head = A.freeze;
  } catch (e) { console.warn('freeze unavailable', e); }
  if (head === src) src.connect(A.dyn); else head.connect(A.dyn);
  A.dyn.connect(A.cut); A.cut.connect(A.lp); A.lp.connect(A.shelf);
  A.shelf.connect(A.dry); A.shelf.connect(A.shaper); A.shaper.connect(A.wet);
  A.dry.connect(A.pan); A.wet.connect(A.pan);
  A.pan.connect(A.lim); A.pan.connect(A.revSend); A.revSend.connect(A.rev); A.rev.connect(A.revOut); A.revOut.connect(A.lim);
  A.lim.connect(A.condOut); A.condOut.connect(A.mix);
  // shimmer bus (never analysed, goes straight to volume)
  A.shim = g(1); A.shimRev = ctx.createConvolver(); A.shimRev.buffer = makeIR(ctx, 4, 2.2);
  A.shim.connect(A.vol); A.shim.connect(A.shimRev); A.shimRevOut = g(.8); A.shimRev.connect(A.shimRevOut); A.shimRevOut.connect(A.vol);
  A.fbuf = new Float32Array(A.an.frequencyBinCount); A.tbuf = new Float32Array(A.an.fftSize);
  A.prevLog = new Float32Array(A.an.frequencyBinCount);
  A.binHz = ctx.sampleRate / A.an.fftSize;
  el.addEventListener('ended', () => { if (!SCULPT.onEnded()) nextPiece(1); });
  el.addEventListener('play', () => { A.playing = true; updatePlayIcon(); });
  el.addEventListener('loadedmetadata', () => { const p = !S.custom && pieceAt(S.pieceIdx); if (p && p.js && isFinite(el.duration)) p.dur = Math.round(el.duration); });
  el.addEventListener('pause', () => { A.playing = false; updatePlayIcon(); });
  el.addEventListener('error', onAudioError);
  A.ready = true;
}

function setModeAudio() {
  if (!A.ready) return;
  const t = A.ctx.currentTime, c = P.mode === 'conduct';
  if (P.mode !== 'recompose') RC.silence();
  A.pure.gain.setTargetAtTime(c ? 0 : 1, t, .08);
  A.condOut.gain.setTargetAtTime(c ? 1 : 0, t, .08);
  if (!c) { unfreeze(); A.el.playbackRate = 1; S.cond.rate = 1; }
}

  const pals = `<div class="chips">${Object.entries(PALETTES).map(([k, p]) => `<button class="chip ${P.palette === k ? 'on' : ''}" data-pal="${k}" ${tipAttrs(p.tip)}><span class="sw" style="background:linear-gradient(135deg,${p.stops.join(',')})"></span>${p.name}</button>`).join('')}</div>`;
  const tempo = `<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><span class="lab" tabindex="0" ${tipAttrs(TIPS.cd_tempo)}>${svg('pulse')}Tempo</span><div class="segs small">${[['off', 'off'], ['speed', 'speed'], ['beat', 'beat']].map(([v, ic]) => `<button class="segb ${P.cd_tempo === v ? 'on' : ''}" data-tempo="${v}" ${tipAttrs(TIPS['tempo_' + v])}>${svg(ic)}${TIPS['tempo_' + v][0]}</button>`).join('')}</div></div>`;
  sBody.innerHTML =
    sec('Setting', 'eye', `<div class="segs">${[['imm', false, 'sky'], ['room', true, 'eye']].map(([k, v, ic]) => `<button class="segb ${!!P.mirror === v ? 'on' : ''}" data-mirror="${v}" ${tipAttrs(TIPS['sky_' + k])}>${svg(ic)}${TIPS['sky_' + k][0]}</button>`).join('')}</div>${P.mirror ? '<div style="height:12px"></div>' + sliderRow('roomDim') + togRow('roomBW') + togRow('faceMagic') : ''}`, '', TIPS.mirror) +
    sec('Worlds', 'globe', `${worlds}${verBtns}<div class="vers">${vers}</div>`, '', SEC_TIPS.worlds) + sculpt + liquid +
    sec('Music', 'music', `${modeSeg}<div style="height:12px"></div><div class="list">${pieces}</div><div class="btns" style="margin-top:10px"><button class="btn" id="openFile" data-tip-title="Your own recording" data-tip="Play any audio file from your computer. You can also drag a file onto the window.">${svg('folder')}Open file</button></div>`, '', SEC_TIPS.music) +
    sec('Light', 'sparkle', media, '', SEC_TIPS.light) +
    sec('Sky', 'sky', skies, '', SEC_TIPS.sky) +
    sec('Color', 'palette', pals, '', SEC_TIPS.color) +
    sec('Virtuoso', 'baton', sliderRow('drag') + sliderRow('grace') + sliderRow('sweep') + sliderRow('coast'), '', SEC_TIPS.virtuoso) +
    sec('Embellish', 'sparkle', ['stars', 'atmos', 'mg_ripples', 'mg_flourish', 'mg_scatter', 'mg_lanterns', 'mg_gather', 'mg_clap', 'edgeGlow'].map(k => togRow(k)).join(''), '', SEC_TIPS.embellish) +
    sec('Conducting', 'baton', tempo + ['cd_dyn', 'cd_fervor', 'cd_hall', 'cd_freeze', 'cd_cutoff', 'cd_lean'].map(k => togRow(k)).join('') + sliderRow('cd_strength'), P.mode === 'conduct' ? '' : 'disabled', SEC_TIPS.conducting) +
    sec('Shimmer', 'bell', togRow('shimmer') + sliderRow('shimVol'), '', SEC_TIPS.shimmer) +
    sec('Feel', 'wave', ['breath', 'trail', 'glow', 'density', 'skyGlow', 'drift'].map(k => sliderRow(k)).join(''), '', SEC_TIPS.feel) +
    sec('Hands', 'hand', `<div class="segs small" style="margin-bottom:8px">${['one', 'two'].map(m => `<button class="segb ${(P.hands === 'two' ? 'two' : 'one') === m ? 'on' : ''}" data-hc="${m}" ${tipAttrs(TIPS['hc_' + m])}>${svg(m === 'one' ? 'hand' : 'hands')}${TIPS['hc_' + m][0]}</button>`).join('')}</div><div class="segs">${['whole', 'fingers'].map(m => `<button class="segb ${P.handMode === m ? 'on' : ''}" data-hm="${m}" ${tipAttrs(TIPS['hm_' + m])}>${svg('hand')}${TIPS['hm_' + m][0]}</button>`).join('')}</div><div style="height:12px"></div>` + sliderRow('flow'), '', SEC_TIPS.hands) +
    sec('Tracking', 'eye', togRow('trackView', 'target') + togRow('ghost') + sliderRow('reach', 1, 1.8, .01, v => v.toFixed(2)) + sliderRow('steady') + sliderRow('snap') + sliderRow('predict') + sliderRow('sens') + sliderRow('budget', .3, 1.5), '', SEC_TIPS.tracking) +
    sec('Live', 'pulse', `<canvas id="meters" data-tip-title="Live readings" data-tip="What the app hears and sees right now: overall loudness, bass, middle, treble, accents, the detected pulse, and what your hands are doing to the music."></canvas>`, '', SEC_TIPS.live);
  $('#studio').scrollTop = sc;

}
sBody.addEventListener('input', e => {
  if (e.target.dataset.k === 'roomDim') document.documentElement.style.setProperty('--dim', P.roomDim);
  const k = e.target.dataset.k; if (!k) return; P[k] = +e.target.value; persist(); setRangeFill(e.target);
  const v = sBody.querySelector(`[data-v="${k}"]`); if (v) v.textContent = k === 'reach' ? P[k].toFixed(2) : Math.round(P[k] * 100);
  if (k === 'budget' || k === 'density') STARLINGS.ensure();
});
sBody.addEventListener('click', e => {
  const b = e.target.closest?.('button'); if (!b) return; const d = b.dataset;
  if (d.world) applyWorld(d.world);
  else if (d.fs) { P.fluidStyleUser = d.fs; setP('fluidStyle', d.fs); }
  else if (d.sym) setP('sym', +d.sym);
  else if (b.id === 'scFinish') SCULPT.finish();
  else if (b.id === 'scClear') SCULPT.clear();
  else if (b.id === 'scGal') GAL.open();
  else if (d.mode) setP('mode', d.mode);
  else if (d.media) { const m = P.media.includes(d.media) ? P.media.filter(x => x !== d.media) : [...P.media, d.media]; if (m.length) { MEDIA_IMPL[d.media].clear(); setP('media', m); } }
  else if (d.sky) setP('sky', d.sky);
  else if (d.pal) setP('palette', d.pal);
  else if (d.tempo) setP('cd_tempo', d.tempo);
  else if (d.mm) { P.musicMapUser = d.mm; setP('musicMap', d.mm); }
  else if (d.mirror !== undefined) { P.mirror = d.mirror === 'true'; applyMirror(); P.mirrorUser = P.mirror; persist(); renderStudio(); }
  else if (d.hm) { SILK.clear(); WEAVE.clear(); setP('handMode', d.hm); }
  else if (d.hc) { SILK.clear(); WEAVE.clear(); setP('hands', d.hc); syncNumHands(); }
  else if (d.t) setP(d.t, !P[d.t]);
  else if (d.piece) { if (!S.started) { S.pieceIdx = +d.piece; renderPicker(); } else loadPiece(+d.piece); }
  else if (d.ver !== undefined) { const v = getVers()[+d.ver]; if (v) { P = { ...DEF, ...v.settings, vol: P.vol }; buildPalette(); setModeAudio(); persist(); syncDock(); renderStudio(); toast(v.name); } }
  else if (d.delver !== undefined) { const v = getVers(); v.splice(+d.delver, 1); setVers(v); renderStudio(); }
  else if (b.id === 'vSave') { const v = getVers(); const name = prompt('Name this version', `${P.world || 'Version'} ${v.length + 1}`); if (name) { v.push({ name, at: Date.now(), settings: { ...P } }); setVers(v); renderStudio(); } }
  else if (b.id === 'vCopy') { navigator.clipboard.writeText(JSON.stringify(P)).then(() => toast('Settings copied')).catch(() => prompt('Copy these settings', JSON.stringify(P))); }
  else if (b.id === 'vPaste') { const t = prompt('Paste settings'); if (t) { try { P = { ...DEF, ...JSON.parse(t) }; buildPalette(); setModeAudio(); persist(); syncDock(); renderStudio(); toast('Settings loaded'); } catch (err) { toast('Those settings could not be read'); } } }
  else if (b.id === 'vReset') { P = { ...DEF, vol: P.vol }; buildPalette(); setModeAudio(); persist(); syncDock(); renderStudio(); }
  else if (b.id === 'openFile') $('#file').click();
  hideTip();
});
function markPiece() { sBody.querySelectorAll('.piece').forEach(el => el.classList.toggle('on', !S.custom && +el.dataset.piece === S.pieceIdx)); }

function drawMeters() {
  const c = $('#meters'); if (!c) return; const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * d)) { c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); }
  const x = c.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, r.width, r.height);
  const au = S.au, C = S.cond;
  const bars = [['level', au.level], ['bass', au.low], ['mid', au.mid], ['treble', au.high], ['accent', au.onset]];
  const bw = (r.width - 8 * 4) / 5;
  bars.forEach(([n, v], i) => {
    const bx = i * (bw + 8), h = 54;
    x.fillStyle = 'rgba(255,255,255,.06)'; x.fillRect(bx, 0, bw, h);
    const g = x.createLinearGradient(0, h, 0, 0); g.addColorStop(0, col(ci(i / 4), .3)); g.addColorStop(1, col(ci(i / 4), 1));
    x.fillStyle = g; x.fillRect(bx, h * (1 - clamp(v)), bw, h * clamp(v));
    x.fillStyle = 'rgba(236,230,244,.5)'; x.font = '10px Inter'; x.textAlign = 'center'; x.fillText(n, bx + bw / 2, h + 13);
  });
  x.textAlign = 'left'; x.fillStyle = 'rgba(236,230,244,.7)'; x.font = '11px Inter';
  const hands = S.real.length;
  x.fillText(`♩ ${Math.round(au.bpm)} bpm   ${hands ? '✋'.repeat(hands) : '·'}${P.mode === 'conduct' ? `   ${C.frozen ? '❄ frozen' : C.rate.toFixed(2) + '×'}  ${(C.dynDb >= 0 ? '+' : '') + C.dynDb.toFixed(1)} dB` : ''}`, 0, 90);
}

// drag & drop audio
addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('on'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').classList.remove('on'); });
addEventListener('drop', async e => { e.preventDefault(); $('#drop').classList.remove('on'); const f = [...e.dataTransfer.files].find(f => f.type.startsWith('audio') || /\.(mp3|ogg|oga|wav|flac|m4a|aac|opus)$/i.test(f.name)); if (!f) return; if (!S.started) await begin(false); loadFile(f); });
$('#file').onchange = e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; };

// keys
addEventListener('keydown', e => {
  if (e.target.matches?.('input:not([type=range]),textarea')) return;
  const k = e.key.toLowerCase();
  if (INTRO.on) { if (!['shift', 'control', 'alt', 'meta'].includes(k)) INTRO.end(); return; }
  if (!S.started) { if (k === 'enter') begin(true); if (k === 'arrowleft') $('#pPrev').click(); if (k === 'arrowright') $('#pNext').click(); return; }
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (k === 'arrowright') nextPiece(1); else if (k === 'arrowleft') nextPiece(-1);
  else if (k === 'f') $('#bFs').click();
  else if (k === 'escape') { if (SONGS.isOpen()) SONGS.close(); else if (GAL.isOpen()) GAL.close(); else if (SCULPT.state === 'view') SCULPT.closeView(); }
  else if (k === 'enter') SCULPT.finish();
  else if (k === 'k') GAL.toggle();
  wake();
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// ================================================================ LIGHTWEAVE: three choices, made up front, and a bar that gets out of the way
const GIFT_ICO = {
  practice: ICO.sparkle, sculpt: ICO.vase,
  field: '<circle cx="5.5" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/><path d="M7.5 12c2.5-6 6.5-6 9 0M7.5 12c2.5 6 6.5 6 9 0"/>',
  weave: '<path d="M3 15c3-7 6-7 9 0s6 7 9 0"/><path d="M3 9c3 7 6 7 9 0s6-7 9 0"/>',
  room: '<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3z"/>',
  deep: '<path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>',
};
const GIFT_TIPS = {
  practice: ['Practice', 'Just play with the light together. Nothing is kept, so try anything.', 'Like a rehearsal before the first dance.'],
  sculpt: ['Sculpt', 'Play just as in Practice, and your movements also build one sculpture of light in the center over the whole piece. When the music ends, it turns in front of you and you can keep it.', 'Like two potters throwing one pot together.'],
  field: ['Field', 'A field of light flows between your two hands, one hand each. In Sculpt, its lines of force are traced one by one into an intricate sculpture in the center, but only while you are both there.', 'Like iron filings between two magnets.'],
  weave: ['Weave', 'Each of you draws a ribbon of light, one warm and one cool, that flies off into the distance. In Sculpt, your movements also wind two strands around each other in the center, like a rope.', 'Like two paths running on together to the horizon.'],
  room: ['Your room', 'See yourselves on camera in black and white, with the light in full color.', 'Like a black-and-white photograph with the light painted in.'],
  deep: ['The Depths', 'An underwater world of shifting light instead of the camera picture.', 'Like looking up from the bottom of a sunlit pool.'],
};
const GIFT_CHOICES = [['gMode', ['practice', 'sculpt']], ['gLight', ['field', 'weave']], ['gBg', ['room', 'deep']]];
const giftSegs = () => GIFT_CHOICES.map(([g, vs]) => `<div class="seg2" data-g="${g}">${vs.map(v => `<button data-v="${v}" ${tipAttrs(GIFT_TIPS[v])}><svg class="i" viewBox="0 0 24 24">${GIFT_ICO[v]}</svg><span>${GIFT_TIPS[v][0]}</span></button>`).join('')}</div>`).join('');
$('#choices').innerHTML = giftSegs(); $('#dockChoices').innerHTML = giftSegs();
function syncGift() { document.querySelectorAll('.seg2').forEach(g => g.querySelectorAll('button').forEach(b => b.classList.toggle('on', P[g.dataset.g] === b.dataset.v))); }
function applyGift() {
  const sculpt = P.gMode === 'sculpt', field = P.gLight === 'field';
  P.media = sculpt ? (field ? ['field', 'sculpt'] : ['weave', 'sculpt']) : [field ? 'field' : 'weave'];
  P.sculptStyle = field ? 'filings' : 'rope'; P.sculptCore = field ? .78 : .6; P.sky = 'deep'; P.palette = 'spectrum'; P.world = '';
  if (S.started) {
    if (P.gBg === 'room' && !S.cam) toast('Your room needs the camera');

}
// a choice applies at once, on the start screen or in the bar; choosing Sculpt starts a fresh sculpture
document.addEventListener('click', e => {
  const b = e.target.closest?.('.seg2 button'); if (!b) return;
  const g = b.parentElement.dataset.g, v = b.dataset.v; if (P[g] === v) return;

});
// the music list opens above the bar and closes as soon as you choose
const SONGS = {
  isOpen: () => !$('#songs').classList.contains('hide'),
  open() {
    const el = $('#songs'), dur = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    el.innerHTML = `<div class="list">${LIBRARY.map((p, i) => `<button class="piece ${!S.custom && S.pieceIdx === i ? 'on' : ''}" data-song="${i}" data-tip-title="${escH(p.c + ' · ' + p.t)}" data-tip="${escH([p.d, p.p ? 'Performed by ' + p.p : '', p.dur ? dur(p.dur) : ''].filter(Boolean).join(' · ') + (p.reb ? ' · one of Reb’s favorites' : ''))}"><span class="st">${p.reb ? '<i class="rb">♥</i>' : ''}</span><span class="pc1">${escH(p.c)}</span><span class="pt">${escH(p.t)}${p.d ? `<small>${escH(p.d)}</small>` : ''}</span></button>`).join('')}</div>`;
    const r = $('#bSong').getBoundingClientRect(); el.style.left = clamp(r.left + r.width / 2, 216, innerWidth - 216) + 'px';

document.addEventListener('mousedown', e => { if (SONGS.isOpen() && !e.target.closest('#songs,#bSong')) SONGS.close(); });

// the introduction: plays once after Begin (any key or Skip ends it; the ? in the bar plays it again)
const INTRO = {
  steps: [
    { t: 'First, allow the camera, so the light can find your hands.', min: 2.2, until: () => S.cam || S.mouseMode, max: 90 },
    { t: 'Stand side by side, where the camera can see you both.', min: 3.4 },
    { t: 'Each of you, raise one hand.', min: 2.6, until: () => S.mouseMode || S.real.filter(h => h.present > .5).length >= 2, max: 16 },
    { t: 'Move, and the light follows your hand.', min: 3.6 },
    { t: 'Together, you conduct it. Here comes the music.', min: 4, music: true },
    { t: 'The bar below changes the music and the light.', min: 3.4 },
    { t: 'Choose Sculpt, and together you\u2019ll build a sculpture of light to keep.', min: 4.2 },
  ],
  on: false, i: -1, t: 0, tm: 0, first: false,
  start(first = false) { this.on = true; this.first = first; this.i = -1; $('#intro').classList.remove('hide'); hideTip(); this.next(); },
  music() { if (this.first && A.ready && A.el.paused) A.el.play().catch(() => {}); this.first = false; },
  next() {
    this.i++; this.t = 0; clearTimeout(this.tm); const el = $('#intro .il'); el.classList.remove('on');

    this.tm = setTimeout(() => { el.textContent = s.t; el.classList.add('on'); if (s.music) this.music(); }, 650);
  },
  end() {

  },
  update(dt) { if (!this.on) return; this.t += dt; const s = this.steps[this.i]; if (s && this.t > s.min + .65 && (!s.until || s.until() || this.t > s.max)) this.next(); },
};
